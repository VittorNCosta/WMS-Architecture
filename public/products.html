<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />
  <title>WMS — Produtos</title>
  <style>
    :root {
      --dark-green: #2e7d32;
      --dark-green-hover: #1b5e20;
      --light-green: #4caf50;
      --white: #ffffff;
      --border-gray: #cfd8dc;
      --text-gray: #5f6b6d;
      --dark-text: #1c2526;
      --error-bg: #fdecea;
      --error-border: #f5c6cb;
      --error-text: #b71c1c;
      --success-bg: #e8f5e9;
      --success-border: #a5d6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--white);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      width: 100%;
      max-width: 900px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(27, 94, 32, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .card__header {
      background: linear-gradient(135deg, var(--dark-green), var(--light-green));
      color: var(--white);
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
    }

    .card__logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.85rem;
      display: block;
    }

    .card__title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .card__subtitle {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .card__body {
      padding: 1.75rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .top-bar__user {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .top-bar__actions {
      display: flex;
      gap: 0.5rem;
    }

    .section {
      border: 1.5px solid var(--border-gray);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .section__title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field__label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-text);
      margin-bottom: 0.4rem;
    }

    .field__required {
      color: var(--error-text);
    }

    .field__input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      color: var(--dark-text);
      border: 1.5px solid var(--border-gray);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .field__input:focus {
      outline: none;
      border-color: var(--light-green);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.22);
    }

    .field__input:disabled {
      background: #f4f6f6;
      color: #9aa5a6;
      cursor: not-allowed;
    }

    .field--checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .field--checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--dark-green);
    }

    .field--checkbox .field__label {
      margin-bottom: 0;
    }

    .field__help {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-gray);
    }

    .button {
      padding: 0.8rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: var(--dark-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .button:hover {
      background: var(--dark-green-hover);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:disabled {
      background: #9aa5a6;
      cursor: progress;
    }

    .button--secondary {
      background: var(--white);
      color: var(--dark-green);
      border: 1.5px solid var(--border-gray);
    }

    .button--secondary:hover {
      background: #f4f6f6;
      color: var(--dark-green-hover);
    }

    .button--small {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
    }

    .message {
      margin-bottom: 1.1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1.5px solid transparent;
      display: none;
    }

    .message--error {
      display: block;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .message--success {
      display: block;
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--dark-green-hover);
    }

    .message--success strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.15rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border-gray);
    }

    th {
      background: #f4f6f6;
      color: var(--text-gray);
      font-weight: 700;
      white-space: nowrap;
    }

    td .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge--active {
      background: var(--success-bg);
      color: var(--dark-green-hover);
      border: 1px solid var(--success-border);
    }

    .badge--inactive {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .empty {
      padding: 1rem;
      text-align: center;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--dark-green);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #updateSection {
      display: none;
    }

    @media (max-width: 480px) {
      .card__header { padding: 1.5rem 1.25rem; }
      .card__body { padding: 1.5rem 1.25rem; }
      .card__title { font-size: 1.2rem; }
      .section { padding: 1rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header class="card__header">
      <svg class="card__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="m3 7.5 9 4.5 9-4.5M12 12v9" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M7.5 5.25 16.5 9.75" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <h1 class="card__title">WMS — Produtos</h1>
      <p class="card__subtitle">Cadastro, consulta e atualização</p>
    </header>

    <div class="card__body">
      <div class="top-bar">
        <span class="top-bar__user" id="userBar"></span>
        <span class="top-bar__actions">
          <a class="button button--secondary button--small" href="menu.html">Menu</a>
          <button class="button button--secondary button--small" type="button" id="logoutButton">Sair</button>
        </span>
      </div>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <!-- Cadastrar -->
      <section class="section" aria-labelledby="createTitle">
        <h2 class="section__title" id="createTitle">Cadastrar produto</h2>
        <form id="createForm" novalidate>
          <div class="field">
            <label class="field__label" for="newSku">SKU <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="newSku" name="sku" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="newName">Nome <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="newName" name="name" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="newDescription">Descrição</label>
            <input class="field__input" type="text" id="newDescription" name="description" autocomplete="off" />
          </div>
          <div class="field">
            <label class="field__label" for="newUnit">Unidade de medida <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="newUnit" name="unitOfMeasure" placeholder="Ex.: UN, CX, KG" autocomplete="off" required />
          </div>
          <button class="button" type="submit" id="createButton">Cadastrar</button>
        </form>
      </section>

      <!-- Atualizar -->
      <section class="section" id="updateSection" aria-labelledby="updateTitle">
        <h2 class="section__title" id="updateTitle">Atualizar produto</h2>
        <form id="updateForm" novalidate>
          <div class="field">
            <label class="field__label" for="editSku">SKU</label>
            <input class="field__input" type="text" id="editSku" disabled />
            <p class="field__help">O SKU não pode ser alterado.</p>
          </div>
          <div class="field">
            <label class="field__label" for="editName">Nome <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="editName" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="editDescription">Descrição</label>
            <input class="field__input" type="text" id="editDescription" autocomplete="off" />
          </div>
          <div class="field">
            <label class="field__label" for="editUnit">Unidade de medida <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="editUnit" autocomplete="off" required />
          </div>
          <div class="field field--checkbox">
            <input type="checkbox" id="editActive" />
            <label class="field__label" for="editActive">Produto ativo</label>
          </div>
          <button class="button" type="submit" id="updateButton">Salvar alterações</button>
          <button class="button button--secondary" type="button" id="cancelEditButton">Cancelar</button>
        </form>
      </section>

      <!-- Listar -->
      <section class="section" aria-labelledby="listTitle">
        <h2 class="section__title" id="listTitle">Produtos cadastrados</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">SKU</th>
                <th scope="col">Nome</th>
                <th scope="col">Un. medida</th>
                <th scope="col">Situação</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="emptyList" class="empty" hidden>Nenhum produto cadastrado ainda.</div>
      </section>

      <p class="footer">
        <a href="/status">Ver status do serviço</a>
      </p>
    </div>
  </main>

  <script src="session.js"></script>
  <script>
    (function () {
      'use strict';

      var user = requireSession();
      if (!user) {
        throw new Error('sem sessão');
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      var messageBox = document.getElementById('message');
      var tableBody = document.getElementById('tableBody');
      var emptyList = document.getElementById('emptyList');
      var updateSection = document.getElementById('updateSection');

      var createForm = document.getElementById('createForm');
      var createButton = document.getElementById('createButton');
      var newSku = document.getElementById('newSku');
      var newName = document.getElementById('newName');
      var newDescription = document.getElementById('newDescription');
      var newUnit = document.getElementById('newUnit');

      var updateForm = document.getElementById('updateForm');
      var updateButton = document.getElementById('updateButton');
      var cancelEditButton = document.getElementById('cancelEditButton');
      var editSku = document.getElementById('editSku');
      var editName = document.getElementById('editName');
      var editDescription = document.getElementById('editDescription');
      var editUnit = document.getElementById('editUnit');
      var editActive = document.getElementById('editActive');

      var editingProductId = null;

      document.getElementById('userBar').innerHTML =
        escapeHtml(user.name) + ' (' + escapeHtml(user.role) + ')';
      document.getElementById('logoutButton').addEventListener('click', function () {
        logout();
      });

      function showMessage(type, htmlContent) {
        messageBox.className = 'message message--' + type;
        messageBox.innerHTML = htmlContent;
        messageBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function clearMessage() {
        messageBox.className = 'message';
        messageBox.innerHTML = '';
      }

      function errorMessageFromResponse(data, fallback) {
        if (data && (data.error || data.message)) {
          return data.error || data.message;
        }
        return fallback;
      }

      function readJson(response) {
        return response.json()
          .then(function (data) {
            return { ok: response.ok, data: data };
          })
          .catch(function () {
            return { ok: response.ok, data: null };
          });
      }

      function loadList() {
        tableBody.innerHTML = '';
        emptyList.hidden = true;

        return apiFetch('/api/products')
          .then(readJson)
          .then(function (result) {
            if (!result.ok || !Array.isArray(result.data)) {
              emptyList.hidden = false;
              emptyList.textContent = errorMessageFromResponse(
                result.data, 'Não foi possível carregar a lista de produtos.'
              );
              return;
            }

            var products = result.data;
            if (products.length === 0) {
              emptyList.hidden = false;
              emptyList.textContent = 'Nenhum produto cadastrado ainda.';
              return;
            }

            products.forEach(function (p) {
              var tr = document.createElement('tr');

              var tdSku = document.createElement('td');
              tdSku.textContent = p.sku == null ? '' : String(p.sku);

              var tdName = document.createElement('td');
              tdName.textContent = p.name == null ? '' : String(p.name);

              var tdUnit = document.createElement('td');
              tdUnit.textContent = p.unitOfMeasure == null ? '' : String(p.unitOfMeasure);

              var tdStatus = document.createElement('td');
              var badge = document.createElement('span');
              badge.className = 'badge ' + (p.active ? 'badge--active' : 'badge--inactive');
              badge.textContent = p.active ? 'Ativo' : 'Inativo';
              tdStatus.appendChild(badge);

              var tdActions = document.createElement('td');
              var editButton = document.createElement('button');
              editButton.type = 'button';
              editButton.className = 'button button--secondary button--small';
              editButton.textContent = 'Editar';
              editButton.addEventListener('click', function () {
                openEdit(p);
              });
              tdActions.appendChild(editButton);

              tr.appendChild(tdSku);
              tr.appendChild(tdName);
              tr.appendChild(tdUnit);
              tr.appendChild(tdStatus);
              tr.appendChild(tdActions);
              tableBody.appendChild(tr);
            });
          })
          .catch(function () {
            emptyList.hidden = false;
            emptyList.textContent = 'Falha de conexão ao carregar a lista de produtos.';
          });
      }

      function openEdit(product) {
        editingProductId = product.id;
        editSku.value = product.sku == null ? '' : String(product.sku);
        editName.value = product.name == null ? '' : String(product.name);
        editDescription.value = product.description == null ? '' : String(product.description);
        editUnit.value = product.unitOfMeasure == null ? '' : String(product.unitOfMeasure);
        editActive.checked = product.active === true;
        updateSection.style.display = 'block';
        updateSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        editName.focus();
      }

      function closeEdit() {
        editingProductId = null;
        updateForm.reset();
        updateSection.style.display = 'none';
      }

      createForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();

        var sku = newSku.value.trim();
        var name = newName.value.trim();
        var unit = newUnit.value.trim();
        var description = newDescription.value.trim();

        if (sku === '') {
          showMessage('error', 'Informe o SKU do produto.');
          newSku.focus();
          return;
        }
        if (name === '') {
          showMessage('error', 'Informe o nome do produto.');
          newName.focus();
          return;
        }
        if (unit === '') {
          showMessage('error', 'Informe a unidade de medida.');
          newUnit.focus();
          return;
        }

        var body = { sku: sku, name: name, unitOfMeasure: unit };
        if (description !== '') {
          body.description = description;
        }

        createButton.disabled = true;
        createButton.textContent = 'Enviando...';

        apiFetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(readJson)
          .then(function (result) {
            if (!result.ok) {
              showMessage('error', escapeHtml(
                errorMessageFromResponse(result.data, 'Não foi possível cadastrar o produto.')
              ));
              return;
            }
            var p = result.data;
            showMessage('success',
              '<strong>Produto cadastrado</strong>' +
              escapeHtml(p.name) + ' (SKU ' + escapeHtml(p.sku) + ') criado com sucesso.'
            );
            createForm.reset();
            newSku.focus();
            loadList();
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
          })
          .finally(function () {
            createButton.disabled = false;
            createButton.textContent = 'Cadastrar';
          });
      });

      updateForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();

        if (!editingProductId) {
          showMessage('error', 'Selecione um produto na lista para editar.');
          return;
        }

        var name = editName.value.trim();
        var unit = editUnit.value.trim();
        var description = editDescription.value.trim();

        if (name === '') {
          showMessage('error', 'Informe o nome do produto.');
          editName.focus();
          return;
        }
        if (unit === '') {
          showMessage('error', 'Informe a unidade de medida.');
          editUnit.focus();
          return;
        }

        var body = {
          name: name,
          description: description,
          unitOfMeasure: unit,
          active: editActive.checked
        };

        updateButton.disabled = true;
        updateButton.textContent = 'Enviando...';

        apiFetch('/api/products/' + encodeURIComponent(editingProductId), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(readJson)
          .then(function (result) {
            if (!result.ok) {
              showMessage('error', escapeHtml(
                errorMessageFromResponse(result.data, 'Não foi possível atualizar o produto.')
              ));
              return;
            }
            var p = result.data;
            showMessage('success',
              '<strong>Produto atualizado</strong>' +
              escapeHtml(p.name) + ' (SKU ' + escapeHtml(p.sku) + ') atualizado com sucesso.'
            );
            closeEdit();
            loadList();
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
          })
          .finally(function () {
            updateButton.disabled = false;
            updateButton.textContent = 'Salvar alterações';
          });
      });

      cancelEditButton.addEventListener('click', function () {
        closeEdit();
        clearMessage();
      });

      loadList();
    })();
  </script>
</body>
</html>
