<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />
  <title>WMS — Acesso ao Sistema</title>
  <style>
    :root {
      --dark-green: #2e7d32;
      --dark-green-hover: #1b5e20;
      --light-green: #4caf50;
      --white: #ffffff;
      --border-gray: #cfd8dc;
      --text-gray: #5f6b6d;
      --dark-text: #1c2526;
      --error-bg: #fdecea;
      --error-border: #f5c6cb;
      --error-text: #b71c1c;
      --success-bg: #e8f5e9;
      --success-border: #a5d6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--white);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(27, 94, 32, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .card__header {
      background: linear-gradient(135deg, var(--dark-green), var(--light-green));
      color: var(--white);
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
    }

    .card__logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.85rem;
      display: block;
    }

    .card__title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .card__subtitle {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .card__body {
      padding: 1.75rem;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field__label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-text);
      margin-bottom: 0.4rem;
    }

    .field__input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      color: var(--dark-text);
      border: 1.5px solid var(--border-gray);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field__input:focus {
      outline: none;
      border-color: var(--light-green);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.22);
    }

    .field__input:disabled {
      background: #f4f6f6;
      color: #9aa5a6;
      cursor: not-allowed;
    }

    .field__help {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-gray);
    }

    .button {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: var(--dark-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .button:hover {
      background: var(--dark-green-hover);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:disabled {
      background: #9aa5a6;
      cursor: progress;
    }

    .message {
      margin-bottom: 1.1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1.5px solid transparent;
      display: none;
    }

    .message--error {
      display: block;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .message--success {
      display: block;
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--dark-green-hover);
    }

    .message--success strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.15rem;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--dark-green);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card__header { padding: 1.5rem 1.25rem; }
      .card__body { padding: 1.5rem 1.25rem; }
      .card__title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header class="card__header">
      <svg class="card__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="m3 7.5 9 4.5 9-4.5M12 12v9" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M7.5 5.25 16.5 9.75" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <h1 class="card__title">WMS — Acesso ao Sistema</h1>
      <p class="card__subtitle">Gestão de Estoque e Movimentações</p>
    </header>

    <div class="card__body">
      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field__label" for="login">Login</label>
          <input
            class="field__input"
            type="text"
            id="login"
            name="login"
            autocomplete="username"
            placeholder="Use: admin ou operador"
            autofocus
          />
          <p class="field__help">Usuários de teste disponíveis: <strong>admin</strong> ou <strong>operador</strong>.</p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Senha</label>
          <input
            class="field__input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Senha do usuário"
          />
          <p class="field__help">Senha padrão dos usuários de teste: <strong>wyms14623</strong>.</p>
        </div>

        <button class="button" type="submit" id="loginButton">Entrar</button>
      </form>

      <p class="footer">
        <a href="/status">Ver status do serviço</a>
      </p>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('loginForm');
      var loginField = document.getElementById('login');
      var passwordField = document.getElementById('password');
      var messageBox = document.getElementById('message');
      var loginButton = document.getElementById('loginButton');

      function showMessage(type, htmlContent) {
        messageBox.className = 'message message--' + type;
        messageBox.innerHTML = htmlContent;
      }

      function clearMessage() {
        messageBox.className = 'message';
        messageBox.innerHTML = '';
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();

        var login = loginField.value.trim();
        var password = passwordField.value;
        if (login === '') {
          showMessage('error', 'Informe o login para continuar.');
          loginField.focus();
          return;
        }
        if (password === '') {
          showMessage('error', 'Informe a senha para continuar.');
          passwordField.focus();
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = 'Entrando...';

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: login, password: password })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              var errorMsg = (result.data && (result.data.error || result.data.message))
                || 'Não foi possível autenticar. Tente novamente.';
              showMessage('error', escapeHtml(errorMsg));
              return;
            }

            var u = result.data.user || result.data;
            showMessage(
              'success',
              '<strong>Bem-vindo, ' + escapeHtml(u.name) + ' (' + escapeHtml(u.role) + ')</strong>' +
              'Acesso liberado ao WMS. Redirecionando...'
            );
            form.reset();
            sessionStorage.setItem('wms_user', JSON.stringify(u));
            if (result.data.token) {
              sessionStorage.setItem('wms_token', result.data.token);
            }
            window.location.href = 'menu.html';
            return;
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
          })
          .finally(function () {
            loginButton.disabled = false;
            loginButton.textContent = 'Entrar';
          });
      });
    })();
  </script>
</body>
</html>
