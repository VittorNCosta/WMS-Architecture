<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />
  <title>WMS — Rastreabilidade</title>
  <style>
    :root {
      --dark-green: #2e7d32;
      --dark-green-hover: #1b5e20;
      --light-green: #4caf50;
      --white: #ffffff;
      --border-gray: #cfd8dc;
      --text-gray: #5f6b6d;
      --dark-text: #1c2526;
      --error-bg: #fdecea;
      --error-border: #f5c6cb;
      --error-text: #b71c1c;
      --success-bg: #e8f5e9;
      --success-border: #a5d6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--white);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      width: 100%;
      max-width: 1100px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(27, 94, 32, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .card__header {
      background: linear-gradient(135deg, var(--dark-green), var(--light-green));
      color: var(--white);
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
    }

    .card__logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.85rem;
      display: block;
    }

    .card__title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .card__subtitle {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .card__body {
      padding: 1.75rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .top-bar__user {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .top-bar__actions {
      display: flex;
      gap: 0.5rem;
    }

    .section {
      border: 1.5px solid var(--border-gray);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .section__title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field__label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-text);
      margin-bottom: 0.4rem;
    }

    .field__input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      color: var(--dark-text);
      border: 1.5px solid var(--border-gray);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .field__input:focus {
      outline: none;
      border-color: var(--light-green);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.22);
    }

    .field__input:disabled {
      background: #f4f6f6;
      color: #9aa5a6;
      cursor: not-allowed;
    }

    .button {
      padding: 0.8rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: var(--dark-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .button:hover {
      background: var(--dark-green-hover);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:disabled {
      background: #9aa5a6;
      cursor: progress;
    }

    .button--secondary {
      background: var(--white);
      color: var(--dark-green);
      border: 1.5px solid var(--border-gray);
    }

    .button--secondary:hover {
      background: #f4f6f6;
      color: var(--dark-green-hover);
    }

    .button--small {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
    }

    .message {
      margin-bottom: 1.1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1.5px solid transparent;
      display: none;
    }

    .message--error {
      display: block;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .filter {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .filter .field {
      flex: 1 1 240px;
      margin-bottom: 0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border-gray);
      vertical-align: top;
    }

    th {
      background: #f4f6f6;
      color: var(--text-gray);
      font-weight: 700;
      white-space: nowrap;
    }

    td.qty, th.qty {
      text-align: right;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge--inbound {
      background: #e8f5e9;
      color: #1b5e20;
      border-color: #a5d6a7;
    }

    .badge--outbound {
      background: #fdecea;
      color: #b71c1c;
      border-color: #f5c6cb;
    }

    .badge--transfer {
      background: #e3f2fd;
      color: #0d47a1;
      border-color: #90caf9;
    }

    .badge--putaway {
      background: #eceff1;
      color: #37474f;
      border-color: #b0bec5;
    }

    .badge--adjustment {
      background: #fff3e0;
      color: #e65100;
      border-color: #ffcc80;
    }

    .records {
      margin-top: 0.85rem;
      font-size: 0.82rem;
      color: var(--text-gray);
      text-align: right;
    }

    .empty {
      padding: 1rem;
      text-align: center;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--dark-green);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card__header { padding: 1.5rem 1.25rem; }
      .card__body { padding: 1.5rem 1.25rem; }
      .card__title { font-size: 1.2rem; }
      .section { padding: 1rem; }
      .filter { flex-direction: column; align-items: stretch; }
      .filter .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header class="card__header">
      <svg class="card__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="m3 7.5 9 4.5 9-4.5M12 12v9" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M7.5 5.25 16.5 9.75" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <h1 class="card__title">WMS — Rastreabilidade</h1>
      <p class="card__subtitle">Histórico de movimentações (entrada, armazenagem, transferência, saída, ajuste)</p>
    </header>

    <div class="card__body">
      <div class="top-bar">
        <span class="top-bar__user" id="userBar"></span>
        <span class="top-bar__actions">
          <a class="button button--secondary button--small" href="menu.html">Menu</a>
          <button class="button button--secondary button--small" type="button" id="logoutButton">Sair</button>
        </span>
      </div>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <section class="section" aria-labelledby="traceabilityTitle">
        <h2 class="section__title" id="traceabilityTitle">Histórico de movimentações</h2>

        <div class="filter">
          <div class="field">
            <label class="field__label" for="productField">Produto</label>
            <select class="field__input" id="productField">
              <option value="">Todos os produtos</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="typeField">Tipo</label>
            <select class="field__input" id="typeField">
              <option value="">Todos os tipos</option>
              <option value="INBOUND">Entrada</option>
              <option value="PUTAWAY">Armazenagem</option>
              <option value="TRANSFER">Transferência</option>
              <option value="OUTBOUND">Saída</option>
              <option value="ADJUSTMENT">Ajuste</option>
            </select>
          </div>
          <button class="button button--secondary" type="button" id="refreshButton">Atualizar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Data/Hora</th>
                <th scope="col">Tipo</th>
                <th scope="col">Produto</th>
                <th scope="col" class="qty">Qtd</th>
                <th scope="col">Origem</th>
                <th scope="col">Destino</th>
                <th scope="col">Usuário</th>
                <th scope="col">Documento</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="emptyList" class="empty" hidden>Nenhuma movimentação registrada.</div>
        <p class="records" id="recordsCounter" hidden></p>
      </section>

      <p class="footer">
        <a href="/status">Ver status do serviço</a>
      </p>
    </div>
  </main>

  <script src="session.js"></script>
  <script>
    (function () {
      'use strict';

      var user = requireSession();
      if (!user) {
        throw new Error('sem sessão');
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      var messageBox = document.getElementById('message');
      var tableBody = document.getElementById('tableBody');
      var emptyList = document.getElementById('emptyList');
      var recordsCounter = document.getElementById('recordsCounter');
      var productField = document.getElementById('productField');
      var typeField = document.getElementById('typeField');
      var refreshButton = document.getElementById('refreshButton');

      var currentMovements = [];
      var productsById = {};
      var locationsById = {};
      var usersById = {};
      var lookupsLoaded = false;

      document.getElementById('userBar').innerHTML =
        escapeHtml(user.name) + ' (' + escapeHtml(user.role) + ')';
      document.getElementById('logoutButton').addEventListener('click', function () {
        logout();
      });

      function showMessage(type, htmlContent) {
        messageBox.className = 'message message--' + type;
        messageBox.innerHTML = htmlContent;
        messageBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function clearMessage() {
        messageBox.className = 'message';
        messageBox.innerHTML = '';
      }

      function errorMessageFromResponse(data, fallback) {
        if (data && (data.error || data.message)) {
          return data.error || data.message;
        }
        return fallback;
      }

      function readJson(response) {
        return response.json()
          .then(function (data) {
            return { ok: response.ok, data: data };
          })
          .catch(function () {
            return { ok: response.ok, data: null };
          });
      }

      function truncateId(id) {
        if (id == null) {
          return '—';
        }
        var text = String(id);
        if (text.length <= 8) {
          return text;
        }
        return text.slice(0, 8) + '…';
      }

      function formatTimestamp(iso) {
        if (iso == null) {
          return '—';
        }
        var date = new Date(iso);
        if (isNaN(date.getTime())) {
          return String(iso);
        }
        var day = String(date.getDate()).padStart(2, '0');
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var year = date.getFullYear();
        var hour = String(date.getHours()).padStart(2, '0');
        var min = String(date.getMinutes()).padStart(2, '0');
        return day + '/' + month + '/' + year + ' ' + hour + ':' + min;
      }

      function typeLabel(type) {
        switch (type) {
          case 'INBOUND': return 'Entrada';
          case 'PUTAWAY': return 'Armazenagem';
          case 'TRANSFER': return 'Transferência';
          case 'OUTBOUND': return 'Saída';
          case 'ADJUSTMENT': return 'Ajuste';
          default: return type == null ? '—' : String(type);
        }
      }

      function typeBadgeClass(type) {
        switch (type) {
          case 'INBOUND': return 'badge badge--inbound';
          case 'PUTAWAY': return 'badge badge--putaway';
          case 'TRANSFER': return 'badge badge--transfer';
          case 'OUTBOUND': return 'badge badge--outbound';
          case 'ADJUSTMENT': return 'badge badge--adjustment';
          default: return 'badge';
        }
      }

      function productLabel(productId) {
        if (productId == null) {
          return '—';
        }
        var p = productsById[productId];
        if (!p) {
          return truncateId(productId);
        }
        var sku = p.sku == null ? '' : String(p.sku);
        var name = p.name == null ? '' : String(p.name);
        if (sku === '' && name === '') {
          return truncateId(productId);
        }
        if (sku === '') return name;
        if (name === '') return sku;
        return sku + ' — ' + name;
      }

      function locationLabel(locationId) {
        if (locationId == null) {
          return '—';
        }
        var l = locationsById[locationId];
        if (!l) {
          return truncateId(locationId);
        }
        return l.code == null || String(l.code) === ''
          ? truncateId(locationId)
          : String(l.code);
      }

      function userLabel(userId) {
        if (userId == null) {
          return '—';
        }
        var u = usersById[userId];
        if (!u) {
          return truncateId(userId);
        }
        if (u.name != null && String(u.name) !== '') {
          return String(u.name);
        }
        if (u.login != null && String(u.login) !== '') {
          return String(u.login);
        }
        return truncateId(userId);
      }

      function populateProductSelect(products) {
        // keep the "All" option and add the rest
        var selected = productField.value;
        while (productField.options.length > 1) {
          productField.remove(1);
        }
        products.forEach(function (p) {
          var opt = document.createElement('option');
          opt.value = String(p.id);
          var sku = p.sku == null ? '' : String(p.sku);
          var name = p.name == null ? '' : String(p.name);
          var label;
          if (sku === '' && name === '') {
            label = truncateId(p.id);
          } else if (sku === '') {
            label = name;
          } else if (name === '') {
            label = sku;
          } else {
            label = sku + ' — ' + name;
          }
          opt.textContent = label;
          productField.appendChild(opt);
        });
        if (selected) {
          productField.value = selected;
        }
      }

      function loadLookups() {
        return Promise.all([
          apiFetch('/api/products').then(readJson).catch(function () { return { ok: false, data: null }; }),
          apiFetch('/api/locations').then(readJson).catch(function () { return { ok: false, data: null }; }),
          apiFetch('/api/users').then(readJson).catch(function () { return { ok: false, data: null }; }),
        ]).then(function (results) {
          var resProducts = results[0];
          var resLocations = results[1];
          var resUsers = results[2];

          productsById = {};
          locationsById = {};
          usersById = {};

          var products = (resProducts.ok && Array.isArray(resProducts.data)) ? resProducts.data : [];
          products.forEach(function (p) {
            if (p && p.id != null) {
              productsById[p.id] = { sku: p.sku, name: p.name };
            }
          });

          var locations = (resLocations.ok && Array.isArray(resLocations.data)) ? resLocations.data : [];
          locations.forEach(function (l) {
            if (l && l.id != null) {
              locationsById[l.id] = { code: l.code };
            }
          });

          var users = (resUsers.ok && Array.isArray(resUsers.data)) ? resUsers.data : [];
          users.forEach(function (u) {
            if (u && u.id != null) {
              usersById[u.id] = { name: u.name, login: u.login };
            }
          });

          // Sort products by SKU for the select
          products.sort(function (a, b) {
            var sa = a && a.sku != null ? String(a.sku) : '';
            var sb = b && b.sku != null ? String(b.sku) : '';
            return sa.localeCompare(sb, 'pt-BR');
          });
          populateProductSelect(products);

          lookupsLoaded = true;
        });
      }

      function render() {
        tableBody.innerHTML = '';

        var typeFilter = typeField.value;
        var total = currentMovements.length;
        var visible = typeFilter === ''
          ? currentMovements
          : currentMovements.filter(function (m) { return m.type === typeFilter; });

        if (total === 0) {
          emptyList.hidden = false;
          emptyList.textContent = 'Nenhuma movimentação registrada.';
          recordsCounter.hidden = true;
          return;
        }

        if (visible.length === 0) {
          emptyList.hidden = false;
          emptyList.textContent = 'Nenhuma movimentação corresponde aos filtros.';
          recordsCounter.hidden = true;
          return;
        }

        emptyList.hidden = true;

        visible.forEach(function (m) {
          var tr = document.createElement('tr');

          var tdDate = document.createElement('td');
          tdDate.textContent = formatTimestamp(m.timestamp);
          tr.appendChild(tdDate);

          var tdType = document.createElement('td');
          var badgeSpan = document.createElement('span');
          badgeSpan.className = typeBadgeClass(m.type);
          badgeSpan.textContent = typeLabel(m.type);
          tdType.appendChild(badgeSpan);
          tr.appendChild(tdType);

          var tdProduct = document.createElement('td');
          tdProduct.textContent = productLabel(m.productId);
          tr.appendChild(tdProduct);

          var tdQty = document.createElement('td');
          tdQty.className = 'qty';
          tdQty.textContent = typeof m.quantity === 'number' ? String(m.quantity) : '—';
          tr.appendChild(tdQty);

          var tdSource = document.createElement('td');
          tdSource.textContent = locationLabel(m.sourceLocationId);
          tr.appendChild(tdSource);

          var tdDestination = document.createElement('td');
          tdDestination.textContent = locationLabel(m.destinationLocationId);
          tr.appendChild(tdDestination);

          var tdUser = document.createElement('td');
          tdUser.textContent = userLabel(m.userId);
          tr.appendChild(tdUser);

          var tdDoc = document.createElement('td');
          tdDoc.textContent = (m.referenceDocument == null || String(m.referenceDocument) === '')
            ? '—'
            : String(m.referenceDocument);
          tr.appendChild(tdDoc);

          tableBody.appendChild(tr);
        });

        recordsCounter.hidden = false;
        if (typeFilter === '') {
          recordsCounter.textContent = 'Registros: ' + visible.length;
        } else {
          recordsCounter.textContent =
            'Registros: ' + visible.length + ' de ' + total;
        }
      }

      function loadMovements() {
        tableBody.innerHTML = '';
        emptyList.hidden = true;
        recordsCounter.hidden = true;
        refreshButton.disabled = true;
        refreshButton.textContent = 'Atualizando...';

        var productId = productField.value;
        var url = '/api/movements';
        if (productId) {
          url += '?productId=' + encodeURIComponent(productId);
        }

        return apiFetch(url)
          .then(readJson)
          .then(function (result) {
            if (!result.ok || !Array.isArray(result.data)) {
              currentMovements = [];
              emptyList.hidden = false;
              emptyList.textContent = errorMessageFromResponse(
                result.data, 'Não foi possível carregar as movimentações.'
              );
              return;
            }
            currentMovements = result.data;
            clearMessage();
            render();
          })
          .catch(function () {
            currentMovements = [];
            emptyList.hidden = false;
            emptyList.textContent = 'Falha de conexão ao carregar as movimentações.';
          })
          .finally(function () {
            refreshButton.disabled = false;
            refreshButton.textContent = 'Atualizar';
          });
      }

      productField.addEventListener('change', function () {
        clearMessage();
        loadMovements();
      });

      typeField.addEventListener('change', function () {
        render();
      });

      refreshButton.addEventListener('click', function () {
        clearMessage();
        if (!lookupsLoaded) {
          loadLookups().then(loadMovements);
        } else {
          loadMovements();
        }
      });

      // Initial: load lookups first (to populate the products select and the maps),
      // then load the movements.
      loadLookups()
        .catch(function () {
          showMessage(
            'error',
            'Não foi possível carregar todos os dados auxiliares (produtos / localizações / usuários). ' +
            'A lista de movimentações será exibida com IDs truncados quando o nome não for encontrado.'
          );
        })
        .then(function () {
          return loadMovements();
        });
    })();
  </script>
</body>
</html>
