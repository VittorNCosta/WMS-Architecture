<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />
  <title>WMS — Usuários</title>
  <style>
    :root {
      --dark-green: #2e7d32;
      --dark-green-hover: #1b5e20;
      --light-green: #4caf50;
      --white: #ffffff;
      --border-gray: #cfd8dc;
      --text-gray: #5f6b6d;
      --dark-text: #1c2526;
      --error-bg: #fdecea;
      --error-border: #f5c6cb;
      --error-text: #b71c1c;
      --success-bg: #e8f5e9;
      --success-border: #a5d6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--white);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      width: 100%;
      max-width: 900px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(27, 94, 32, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .card__header {
      background: linear-gradient(135deg, var(--dark-green), var(--light-green));
      color: var(--white);
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
    }

    .card__logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.85rem;
      display: block;
    }

    .card__title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .card__subtitle {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .card__body {
      padding: 1.75rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .top-bar__user {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .top-bar__actions {
      display: flex;
      gap: 0.5rem;
    }

    .section {
      border: 1.5px solid var(--border-gray);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .section__title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field__label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-text);
      margin-bottom: 0.4rem;
    }

    .field__required {
      color: var(--error-text);
    }

    .field__input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      color: var(--dark-text);
      border: 1.5px solid var(--border-gray);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .field__input:focus {
      outline: none;
      border-color: var(--light-green);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.22);
    }

    .field__input:disabled {
      background: #f4f6f6;
      color: #9aa5a6;
      cursor: not-allowed;
    }

    .field__help {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-gray);
    }

    .button {
      padding: 0.8rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: var(--dark-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .button:hover {
      background: var(--dark-green-hover);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:disabled {
      background: #9aa5a6;
      cursor: progress;
    }

    .button--secondary {
      background: var(--white);
      color: var(--dark-green);
      border: 1.5px solid var(--border-gray);
    }

    .button--secondary:hover {
      background: #f4f6f6;
      color: var(--dark-green-hover);
    }

    .button--small {
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
    }

    .message {
      margin-bottom: 1.1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1.5px solid transparent;
      display: none;
    }

    .message--error {
      display: block;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .message--success {
      display: block;
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--dark-green-hover);
    }

    .message--success strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.15rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border-gray);
    }

    th {
      background: #f4f6f6;
      color: var(--text-gray);
      font-weight: 700;
      white-space: nowrap;
    }

    td .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge--active {
      background: var(--success-bg);
      color: var(--dark-green-hover);
      border: 1px solid var(--success-border);
    }

    .badge--inactive {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .actions-cell {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .empty {
      padding: 1rem;
      text-align: center;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--dark-green);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #updateSection {
      display: none;
    }

    .button--danger {
      background: var(--error-text);
    }

    .button--danger:hover {
      background: #8e1414;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 37, 38, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 1000;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(27, 94, 32, 0.25), 0 4px 12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: modal-in 0.15s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal__header {
      background: linear-gradient(135deg, var(--dark-green), var(--light-green));
      color: var(--white);
      padding: 1.1rem 1.4rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal__body {
      padding: 1.4rem;
      font-size: 0.95rem;
      color: var(--dark-text);
      line-height: 1.5;
    }

    .modal__actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      padding: 0 1.4rem 1.4rem;
    }

    @media (max-width: 480px) {
      .card__header { padding: 1.5rem 1.25rem; }
      .card__body { padding: 1.5rem 1.25rem; }
      .card__title { font-size: 1.2rem; }
      .section { padding: 1rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header class="card__header">
      <svg class="card__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="m3 7.5 9 4.5 9-4.5M12 12v9" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M7.5 5.25 16.5 9.75" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <h1 class="card__title">WMS — Usuários</h1>
      <p class="card__subtitle">Cadastro, edição e gerenciamento de permissões</p>
    </header>

    <div class="card__body">
      <div class="top-bar">
        <span class="top-bar__user" id="userBar"></span>
        <span class="top-bar__actions">
          <a class="button button--secondary button--small" href="menu.html">Menu</a>
          <button class="button button--secondary button--small" type="button" id="logoutButton">Sair</button>
        </span>
      </div>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <!-- Cadastrar -->
      <section class="section" aria-labelledby="createTitle">
        <h2 class="section__title" id="createTitle">Cadastrar usuário</h2>
        <form id="createForm" novalidate>
          <div class="field">
            <label class="field__label" for="newName">Nome <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="newName" name="name" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="newLogin">Login <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="newLogin" name="login" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="newRole">Perfil <span class="field__required" aria-hidden="true">*</span></label>
            <select class="field__input" id="newRole" name="role" required>
              <option value="" disabled selected>Selecione um perfil</option>
              <option value="STOCK_LEADER">LÍDER DE ESTOQUE</option>
              <option value="RECEIVING">RECEBIMENTO</option>
              <option value="SHIPPING">EXPEDIÇÃO</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="newPassword">Senha <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="password" id="newPassword" name="password" autocomplete="new-password" required />
            <p class="field__help">Mínimo de 6 caracteres.</p>
          </div>
          <button class="button" type="submit" id="createButton">Cadastrar</button>
        </form>
      </section>

      <!-- Atualizar -->
      <section class="section" id="updateSection" aria-labelledby="updateTitle">
        <h2 class="section__title" id="updateTitle">Editar usuário</h2>
        <form id="updateForm" novalidate>
          <div class="field">
            <label class="field__label" for="editLogin">Login</label>
            <input class="field__input" type="text" id="editLogin" disabled />
            <p class="field__help">O login não pode ser alterado.</p>
          </div>
          <div class="field">
            <label class="field__label" for="editName">Nome <span class="field__required" aria-hidden="true">*</span></label>
            <input class="field__input" type="text" id="editName" autocomplete="off" required />
          </div>
          <div class="field">
            <label class="field__label" for="editRole">Perfil <span class="field__required" aria-hidden="true">*</span></label>
            <select class="field__input" id="editRole" required>
              <option value="STOCK_LEADER">LÍDER DE ESTOQUE</option>
              <option value="RECEIVING">RECEBIMENTO</option>
              <option value="SHIPPING">EXPEDIÇÃO</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <button class="button" type="submit" id="updateButton">Salvar alterações</button>
          <button class="button button--secondary" type="button" id="cancelEditButton">Cancelar</button>
        </form>
      </section>

      <!-- Listar -->
      <section class="section" aria-labelledby="listTitle">
        <h2 class="section__title" id="listTitle">Usuários cadastrados</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Login</th>
                <th scope="col">Nome</th>
                <th scope="col">Perfil</th>
                <th scope="col">Situação</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="emptyList" class="empty" hidden>Nenhum usuário cadastrado ainda.</div>
      </section>

      <p class="footer">
        <a href="/status">Ver status do serviço</a>
      </p>
    </div>
  </main>

  <!-- Modal de confirmação (substitui o window.confirm nativo) -->
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <div class="modal__header" id="confirmTitle">Confirmar ação</div>
      <div class="modal__body" id="confirmMessage"></div>
      <div class="modal__actions">
        <button class="button button--secondary" type="button" id="confirmCancel">Cancelar</button>
        <button class="button button--danger" type="button" id="confirmOk">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="session.js"></script>
  <script>
    (function () {
      'use strict';

      var user = requireSession();
      if (!user) {
        throw new Error('sem sessão');
      }

      var ROLE_LABELS = {
        STOCK_LEADER: 'LÍDER DE ESTOQUE',
        RECEIVING: 'RECEBIMENTO',
        SHIPPING: 'EXPEDIÇÃO',
        ADMIN: 'ADMIN'
      };

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      function roleLabel(value) {
        if (value == null) {
          return '';
        }
        var key = String(value);
        return ROLE_LABELS[key] != null ? ROLE_LABELS[key] : key;
      }

      var messageBox = document.getElementById('message');
      var tableBody = document.getElementById('tableBody');
      var emptyList = document.getElementById('emptyList');
      var updateSection = document.getElementById('updateSection');

      var createForm = document.getElementById('createForm');
      var createButton = document.getElementById('createButton');
      var newName = document.getElementById('newName');
      var newLogin = document.getElementById('newLogin');
      var newRole = document.getElementById('newRole');
      var newPassword = document.getElementById('newPassword');

      var updateForm = document.getElementById('updateForm');
      var updateButton = document.getElementById('updateButton');
      var cancelEditButton = document.getElementById('cancelEditButton');
      var editLogin = document.getElementById('editLogin');
      var editName = document.getElementById('editName');
      var editRole = document.getElementById('editRole');

      var editingUserId = null;

      document.getElementById('userBar').innerHTML =
        escapeHtml(user.name) + ' (' + escapeHtml(user.role) + ')';
      document.getElementById('logoutButton').addEventListener('click', function () {
        logout();
      });

      function showMessage(type, htmlContent) {
        messageBox.className = 'message message--' + type;
        messageBox.innerHTML = htmlContent;
        messageBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function clearMessage() {
        messageBox.className = 'message';
        messageBox.innerHTML = '';
      }

      function errorMessageFromResponse(data, fallback) {
        if (data && (data.error || data.message)) {
          return data.error || data.message;
        }
        return fallback;
      }

      function readJson(response) {
        return response.json()
          .then(function (data) {
            return { ok: response.ok, data: data };
          })
          .catch(function () {
            return { ok: response.ok, data: null };
          });
      }

      // Modal de confirmação estilizado (substitui o window.confirm nativo).
      var confirmModal = document.getElementById('confirmModal');
      var confirmTitle = document.getElementById('confirmTitle');
      var confirmMessage = document.getElementById('confirmMessage');
      var confirmCancelButton = document.getElementById('confirmCancel');
      var confirmOkButton = document.getElementById('confirmOk');
      var confirmCallback = null;

      function openConfirm(options) {
        confirmTitle.textContent = options.title || 'Confirmar ação';
        confirmMessage.innerHTML = options.message || '';
        confirmOkButton.textContent = options.confirmLabel || 'Confirmar';
        confirmOkButton.className = 'button' + (options.danger ? ' button--danger' : '');
        confirmCallback = typeof options.onConfirm === 'function' ? options.onConfirm : null;
        confirmModal.classList.add('is-open');
        confirmOkButton.focus();
      }

      function closeConfirm() {
        confirmModal.classList.remove('is-open');
        confirmCallback = null;
      }

      confirmCancelButton.addEventListener('click', closeConfirm);
      confirmOkButton.addEventListener('click', function () {
        var cb = confirmCallback;
        closeConfirm();
        if (cb) { cb(); }
      });
      confirmModal.addEventListener('click', function (event) {
        if (event.target === confirmModal) { closeConfirm(); }
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && confirmModal.classList.contains('is-open')) { closeConfirm(); }
      });

      function loadList() {
        tableBody.innerHTML = '';
        emptyList.hidden = true;

        return apiFetch('/api/users')
          .then(readJson)
          .then(function (result) {
            if (!result.ok || !Array.isArray(result.data)) {
              emptyList.hidden = false;
              emptyList.textContent = errorMessageFromResponse(
                result.data, 'Não foi possível carregar a lista de usuários.'
              );
              return;
            }

            var users = result.data;
            if (users.length === 0) {
              emptyList.hidden = false;
              emptyList.textContent = 'Nenhum usuário cadastrado ainda.';
              return;
            }

            users.forEach(function (u) {
              var tr = document.createElement('tr');

              var tdLogin = document.createElement('td');
              tdLogin.textContent = u.login == null ? '' : String(u.login);

              var tdName = document.createElement('td');
              tdName.textContent = u.name == null ? '' : String(u.name);

              var tdRole = document.createElement('td');
              tdRole.textContent = roleLabel(u.role);

              var tdStatus = document.createElement('td');
              var badge = document.createElement('span');
              badge.className = 'badge ' + (u.active ? 'badge--active' : 'badge--inactive');
              badge.textContent = u.active ? 'Ativo' : 'Inativo';
              tdStatus.appendChild(badge);

              var tdActions = document.createElement('td');
              var actionsDiv = document.createElement('div');
              actionsDiv.className = 'actions-cell';

              var editButton = document.createElement('button');
              editButton.type = 'button';
              editButton.className = 'button button--secondary button--small';
              editButton.textContent = 'Editar';
              editButton.addEventListener('click', function () {
                openEdit(u);
              });
              actionsDiv.appendChild(editButton);

              var statusButton = document.createElement('button');
              statusButton.type = 'button';
              statusButton.className = 'button button--secondary button--small';
              statusButton.textContent = u.active ? 'Inativar' : 'Ativar';
              statusButton.addEventListener('click', function () {
                toggleStatus(u, statusButton);
              });
              actionsDiv.appendChild(statusButton);

              tdActions.appendChild(actionsDiv);

              tr.appendChild(tdLogin);
              tr.appendChild(tdName);
              tr.appendChild(tdRole);
              tr.appendChild(tdStatus);
              tr.appendChild(tdActions);
              tableBody.appendChild(tr);
            });
          })
          .catch(function () {
            emptyList.hidden = false;
            emptyList.textContent = 'Falha de conexão ao carregar a lista de usuários.';
          });
      }

      function openEdit(targetUser) {
        editingUserId = targetUser.id;
        editLogin.value = targetUser.login == null ? '' : String(targetUser.login);
        editName.value = targetUser.name == null ? '' : String(targetUser.name);
        editRole.value = targetUser.role == null ? '' : String(targetUser.role);
        updateSection.style.display = 'block';
        updateSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        editName.focus();
      }

      function closeEdit() {
        editingUserId = null;
        updateForm.reset();
        updateSection.style.display = 'none';
      }

      function toggleStatus(targetUser, button) {
        clearMessage();

        var newState = !targetUser.active;
        if (!newState) {
          var displayName = targetUser.name == null ? targetUser.login : targetUser.name;
          openConfirm({
            title: 'Inativar usuário',
            message: 'Tem certeza que deseja inativar o usuário <strong>' +
              escapeHtml(displayName) + '</strong>?',
            confirmLabel: 'Inativar',
            danger: true,
            onConfirm: function () { performToggle(targetUser, button, newState); }
          });
          return;
        }

        performToggle(targetUser, button, newState);
      }

      function performToggle(targetUser, button, newState) {
        button.disabled = true;
        var originalText = button.textContent;
        button.textContent = 'Aguarde...';

        apiFetch('/api/users/' + encodeURIComponent(targetUser.id) + '/status', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active: newState })
        })
          .then(readJson)
          .then(function (result) {
            if (!result.ok) {
              showMessage('error', escapeHtml(
                errorMessageFromResponse(result.data, 'Não foi possível atualizar a situação do usuário.')
              ));
              button.disabled = false;
              button.textContent = originalText;
              return;
            }
            var u = result.data;
            var finalName = u && u.name ? u.name : (targetUser.name || targetUser.login);
            showMessage('success',
              '<strong>Situação atualizada</strong>' +
              escapeHtml(finalName) + ' agora está ' + (newState ? 'ativo' : 'inativo') + '.'
            );
            loadList();
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
            button.disabled = false;
            button.textContent = originalText;
          });
      }

      createForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();

        var name = newName.value.trim();
        var login = newLogin.value.trim();
        var role = newRole.value;
        var password = newPassword.value;

        if (name === '') {
          showMessage('error', 'Informe o nome do usuário.');
          newName.focus();
          return;
        }
        if (login === '') {
          showMessage('error', 'Informe o login do usuário.');
          newLogin.focus();
          return;
        }
        if (role === '') {
          showMessage('error', 'Selecione um perfil para o usuário.');
          newRole.focus();
          return;
        }
        if (password.length < 6) {
          showMessage('error', 'A senha deve ter ao menos 6 caracteres.');
          newPassword.focus();
          return;
        }

        var body = { name: name, login: login, role: role, password: password };

        createButton.disabled = true;
        createButton.textContent = 'Enviando...';

        apiFetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(readJson)
          .then(function (result) {
            if (!result.ok) {
              showMessage('error', escapeHtml(
                errorMessageFromResponse(result.data, 'Não foi possível cadastrar o usuário.')
              ));
              return;
            }
            var u = result.data;
            showMessage('success',
              '<strong>Usuário cadastrado</strong>' +
              escapeHtml(u.name) + ' (login ' + escapeHtml(u.login) + ') criado com sucesso.'
            );
            createForm.reset();
            newName.focus();
            loadList();
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
          })
          .finally(function () {
            createButton.disabled = false;
            createButton.textContent = 'Cadastrar';
          });
      });

      updateForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();

        if (!editingUserId) {
          showMessage('error', 'Selecione um usuário na lista para editar.');
          return;
        }

        var name = editName.value.trim();
        var role = editRole.value;

        if (name === '') {
          showMessage('error', 'Informe o nome do usuário.');
          editName.focus();
          return;
        }
        if (role === '') {
          showMessage('error', 'Selecione um perfil para o usuário.');
          editRole.focus();
          return;
        }

        var body = { name: name, role: role };

        updateButton.disabled = true;
        updateButton.textContent = 'Enviando...';

        apiFetch('/api/users/' + encodeURIComponent(editingUserId), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(readJson)
          .then(function (result) {
            if (!result.ok) {
              showMessage('error', escapeHtml(
                errorMessageFromResponse(result.data, 'Não foi possível atualizar o usuário.')
              ));
              return;
            }
            var u = result.data;
            showMessage('success',
              '<strong>Usuário atualizado</strong>' +
              escapeHtml(u.name) + ' (login ' + escapeHtml(u.login) + ') atualizado com sucesso.'
            );
            closeEdit();
            loadList();
          })
          .catch(function () {
            showMessage('error', 'Falha de conexão com o servidor. Verifique sua rede e tente novamente.');
          })
          .finally(function () {
            updateButton.disabled = false;
            updateButton.textContent = 'Salvar alterações';
          });
      });

      cancelEditButton.addEventListener('click', function () {
        closeEdit();
        clearMessage();
      });

      loadList();
    })();
  </script>
</body>
</html>
